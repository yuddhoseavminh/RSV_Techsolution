services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kt_solution_backend
    restart: always
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    command: >
      sh -c "composer install --no-interaction &&
             php artisan migrate --force &&
             php artisan db:seed --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kt_solution_frontend
    restart: always
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
